spring:
  # A lib roda o próprio schema via BillingFlywayAutoConfiguration (Flyway
  # dedicado, histórico flyway_schema_history_billing). O Flyway "do host" não
  # tem nada a migrar nos testes.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jp:
  billing:
    reconciliation-enabled: false
    asaas:
      api-key: test
      webhook-token: test-webhook-token

logging:
  level:
    org.springframework.orm.jpa: WARN
